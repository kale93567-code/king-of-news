<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>King of News - MKI Tech</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #000; color: #fff; display: flex; flex-direction: column; height: 100vh; justify-content: space-between; }
        .header { padding: 15px; background: #111; text-align: center; font-weight: bold; font-size: 1.2rem; color: #ffd700; border-bottom: 1px solid #333; }
        .content { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; text-align: center; }
        .section { display: none; width: 100%; max-width: 400px; }
        .active { display: block; }
        .reel-card { background: #1a1a1a; padding: 20px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #333; text-align: left; }
        .author { color: #00e5ff; font-weight: bold; margin-bottom: 8px; }
        input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: none; font-size: 1rem; }
        input { background: #222; color: #fff; border: 1px solid #444; }
        button { background: #e50914; color: white; font-weight: bold; cursor: pointer; }
        .bottom-nav { display: flex; justify-content: space-around; background: #111; padding: 12px 0; border-top: 1px solid #333; position: fixed; bottom: 0; width: 100%; }
        .nav-btn { color: #888; background: none; border: none; font-size: 0.9rem; width: auto; padding: 0; margin: 0; cursor: pointer; }
        .nav-btn.active-tab { color: #00e5ff; font-weight: bold; }
        .live-btn { color: #ff0055; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">👑 King of News</div>

    <div class="content">
        <!-- Reels Section -->
        <div id="reels" class="section active">
            <div class="reel-card">
                <div class="author">@Galli_Informer_MK 📍 (0.8 km)</div>
                <p>हायवेवर मोठी ट्रॅफिक जाम! ५ किमी परिसरातील लोकांनी हा रस्ता टाळावा.</p>
            </div>
        </div>

        <!-- Search Section -->
        <div id="search" class="section">
            <h3>🔍 बातमी किंवा परिसर शोधा</h3>
            <input type="text" placeholder="येथे टाइप करा (उदा. पुणे, ट्रॅफिक)...">
            <button onclick="alert('शोध घेतला जात आहे...')">शोधा</button>
        </div>

        <!-- Profile Section -->
        <div id="profile" class="section">
            <h3>👤 तुमची प्रोफाइल</h3>
            <input type="text" id="username" placeholder="तुमचे नाव">
            <input type="text" id="usercity" placeholder="तुमचे शहर/गाव">
            <button onclick="saveProfile()">सेव्ह करा</button>
            <p id="profile-msg" style="color: #00ff66; margin-top: 10px;"></p>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <button class="nav-btn active-tab" onclick="showTab('reels', this)">📺 Reels</button>
        <button class="nav-btn" onclick="showTab('search', this)">🔍 Search</button>
        <button class="nav-btn live-btn" onclick="alert('🔴 LIVE प्रवाह लवकरच सुरू होत आहे!')">🔴 LIVE</button>
        <button class="nav-btn" onclick="showTab('profile', this)">👤 Profile</button>
    </div>

    <script>
        function showTab(tabId, btn) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active-tab'));
            
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active-tab');
        }

        function saveProfile() {
            const name = document.getElementById('username').value;
            if(name) {
                document.getElementById('profile-msg').innerText = "स्वागत आहे, " + name + "! प्रोफाइल सेव्ह झाली.";
            } else {
                alert("कृपया नाव टाका!");
            }
        }
    </script>
</body>
</html>
